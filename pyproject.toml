[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amaranta-shop-catalog-api"
version = "0.1.0"
description = "The catalog domain of Amaranta Shop: browse the products, reserve and release stock."
requires-python = ">=3.12"
# The core (src/catalog/domain and src/catalog/application) imports none of these: only the adapters and the
# composition root do. tests/test_architecture.py fails if that stops being true.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pymongo>=4.8,<5",
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
